function configureService(id){data.selectedService=id;save();let s=data.services.find(x=>x.id===id),c=data.calculators.find(x=>x.id===s.calculator);openModal('Configure '+s.name,`<div class="tabs"><div class="tab on">Overview</div><div class="tab">Sub-services</div><div class="tab">Pricing</div><div class="tab">Request Form</div><div class="tab">Workflow</div></div><div class="formgrid"><div class="f"><label>Service name</label><input id="ecName" value="${esc(s.name)}"></div><div class="f"><label>Code</label><input id="ecCode" value="${esc(s.code)}"></div><div class="f"><label>Division</label><select id="ecDivision">${divisions.map(x=>`<option ${x===s.division?'selected':''}>${x}</option>`).join('')}</select></div><div class="f"><label>Owner role</label><input id="ecOwner" value="${esc(s.owner)}"></div><div class="f full"><label>Description</label><textarea id="ecDesc">${esc(s.description)}</textarea></div><div class="f"><label>SLA (days)</label><input id="ecSla" type="number" value="${s.sla}"></div><div class="f"><label>Status</label><select id="ecStatus"><option ${s.status==='Active'?'selected':''}>Active</option><option ${s.status==='Draft'?'selected':''}>Draft</option><option ${s.status==='Paused'?'selected':''}>Paused</option></select></div></div><div class="g2"><div class="notice blue"><b>Sub-services</b><br>${s.subs.map(esc).join(' · ')}</div><div class="notice greenbox"><b>Assigned calculator</b><br>${esc(c?.name||'None')}</div></div><div class="notice yellow"><b>Request fields:</b> ${s.form.map(esc).join(', ')}</div><div class="notice blue"><b>Workflow:</b> ${s.workflow.map(esc).join(' → ')}</div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveServiceEdit('${id}')">Save Configuration</button>`,true)}
function saveServiceEdit(id){let s=data.services.find(x=>x.id===id);Object.assign(s,{name:ecName.value,code:ecCode.value,division:ecDivision.value,owner:ecOwner.value,description:ecDesc.value,sla:+ecSla.value,status:ecStatus.value});save();closeModal();log('Service','Updated '+id);render();toastMsg('Service configuration saved','ok')}
function calculators(){let rows=data.calculators.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="rsub">${c.id}</div></td><td>${esc(c.service)}</td><td>${esc(c.template)}</td><td>${c.fields.length}</td><td>${c.deposit}%</td><td>&gt; ${c.approval}% discount</td><td><button class="btn small" onclick="activeCalc='${c.id}';render()">Test</button></td></tr>`).join(''),c=data.calculators.find(x=>x.id===activeCalc)||data.calculators[0];
return `<div class="g21"><div class="card"><div class="ch"><div><div class="ct">Service Calculator Library</div><div class="cs">Reusable formulas for estimates, quotes and invoices</div></div><button class="btn primary" onclick="openCalculator()">New Calculator</button></div><div class="tw"><table class="tbl"><thead><tr><th>Calculator</th><th>Service</th><th>Template</th><th>Fields</th><th>Deposit</th><th>Approval</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="card"><div class="ch"><div><div class="ct">Live Calculator Test</div><div class="cs">${esc(c.name)}</div></div></div>${c.fields.map((f,i)=>`<div class="f"><label>${esc(f[1])}</label><input class="calcInput" data-key="${f[0]}" type="number" value="${f[2]}" oninput="evalCalc()"></div>`).join('')}<div class="notice blue"><b>Formula</b><br><code>${esc(c.formula)}</code></div><div class="kc" style="background:#f4f7ff"><div class="kl">Estimated client price</div><div class="kv" id="calcOut">₦0</div><div class="ks" id="calcInfo"></div></div><script>setTimeout(evalCalc,0)<\/script></div></div>`}
function evalCalc(){let c=data.calculators.find(x=>x.id===activeCalc),vars={};document.querySelectorAll('.calcInput').forEach(e=>vars[e.dataset.key]=+e.value);let sub=0;try{sub=Function(...Object.keys(vars),'return '+c.formula)(...Object.values(vars))}catch(e){}let tax=sub*c.tax/100,total=sub+tax;if(document.getElementById('calcOut')){calcOut.textContent=money(total);calcInfo.textContent=`Subtotal ${money(sub)} · Tax ${c.tax}% (${money(tax)}) · Deposit ${money(total*c.deposit/100)}`}}

unit_rate|Unit rate|100000

function createCalculator(){let fs=ncFields.value.split('\n').map(x=>x.split('|')).filter(x=>x.length>2).map(x=>[x[0].trim(),x[1].trim(),+x[2]]),id='CALC-'+String(Date.now()).slice(-6);data.calculators.push({id,name:ncName.value||'New Calculator',service:ncService.value,template:ncTemplate.value,formula:ncFormula.value,fields:fs,tax:+ncTax.value,deposit:+ncDeposit.value,approval:5});activeCalc=id;save();closeModal();log('Calculator','Created '+id);render();toastMsg('Calculator created','ok')}
const fieldDefs=[['text','Text Field'],['number','Number Field'],['select','Dropdown'],['date','Date Field'],['file','File Upload'],['checkbox','Consent Checkbox'],['location','Location'],['client','Client Identity'],['budget','Budget Range']];
function formBuilder(){let s=data.services.find(x=>x.id===data.selectedService)||data.services[0];data.formDraft[s.id]=data.formDraft[s.id]||s.form.map((x,i)=>({type:i<3?'client':'text',label:x,required:true}));let fields=data.formDraft[s.id];return `<div class="builder"><div class="palette"><div class="ct" style="margin-bottom:8px">Field Palette</div>${fieldDefs.map(f=>`<div class="pal" onclick="addField('${f[0]}')"><i class="ti ti-plus"></i>${f[1]}</div>`).join('')}<button class="btn primary block" onclick="saveForm()">Save Form</button></div><div class="canvas"><div class="ch"><div><div class="ct">Service Request Form Builder</div><div class="cs">Create the exact information required per service</div></div><select id="fbService" onchange="data.selectedService=this.value;save();render()">${data.services.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div id="formCanvas">${fields.map((f,i)=>`<div class="cf"><i class="ti ti-grip-vertical" style="color:var(--t3)"></i><div class="rm"><div class="rn">${esc(f.label)}</div><div class="rsub">${f.type} · ${f.required?'Required':'Optional'}</div></div><button class="btn small" onclick="editField(${i})">Edit</button><button class="btn small" onclick="deleteField(${i})">Delete</button></div>`).join('')}</div></div></div>`}

function workflows(){let s=data.services.find(x=>x.id===data.selectedService)||data.services[0];data.workflowDraft[s.id]=data.workflowDraft[s.id]||s.workflow.map((x,i)=>({name:x,owner:['CSRC / Sales','Service Owner','Finance','Operations','Assigned Team','Supervisor','Client'][Math.min(i,6)],sla:i===0?1:2,approval:/Approval|Review|Payment|Inspection/.test(x),evidence:i>1}));let arr=data.workflowDraft[s.id];return `<div class="card"><div class="ch"><div><div class="ct">Workflow & Fulfillment Designer</div><div class="cs">Stages, owners, SLAs, approvals, evidence and client checkpoints</div></div><div class="acts"><select onchange="data.selectedService=this.value;save();render()">${data.services.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="btn" onclick="addStage()">Add Stage</button><button class="btn primary" onclick="saveWorkflow()">Save Workflow</button></div></div>${life(arr.map(x=>x.name),-1)}<div class="tw" style="margin-top:12px"><table class="tbl"><thead><tr><th>Stage</th><th>Owner</th><th>SLA</th><th>Approval</th><th>Evidence</th><th></th></tr></thead><tbody>${arr.map((x,i)=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.owner)}</td><td>${x.sla} day(s)</td><td>${x.approval?'Yes':'No'}</td><td>${x.evidence?'Required':'Optional'}</td><td><button class="btn small" onclick="editStage(${i})">Edit</button> <button class="btn small" onclick="deleteStage(${i})">Delete</button></td></tr>`).join('')}</tbody></table></div></div><div class="g2"><div class="card"><div class="ch"><div class="ct">Automation Rules</div><button class="btn small" onclick="openRule()">Add Rule</button></div>${['Payment threshold met → create order and notify Operations','Stage overdue → escalate to supervisor','Deliverable approved → notify client and unlock next stage','Client requests revision → reopen task and retain version'].map((x,i)=>`<div class="row"><div class="ico" style="background:#edf2ff;color:var(--n)"><i class="ti ti-bolt"></i></div><div class="rm"><div class="rn">Rule ${i+1}</div><div class="rsub">${x}</div></div>${badge('Active')}</div>`).join('')}</div><div class="card"><div class="ch"><div class="ct">Fulfillment Modes</div></div>${[['Quick Service Order','Short work without a full project'],['Managed Service Case','Recurring or retained service'],['Project & Worksite','Engineering and multi-milestone work']].map(x=>`<div class="row"><div class="ico" style="background:#dbeafe;color:#1e40af"><i class="ti ti-subtask"></i></div><div class="rm"><div class="rn">${x[0]}</div><div class="rsub">${x[1]}</div></div></div>`).join('')}</div></div>`}

function showRequest(id){data.selectedRequest=id;save();let r=data.requests.find(x=>x.id===id);openModal('Request 360 File — '+id,`<div class="g21"><div><div class="card"><div class="ch"><div><div class="ct">${esc(r.client)}</div><div class="cs">${esc(r.service)} · ${esc(r.branch)} · ${r.created}</div></div>${badge(r.status)}</div>${life(['Request','Review','Assessment','Quote','Approval','Invoice','Order','Fulfillment'],2)}</div><div class="card"><div class="ch"><div><div class="ct">Request Information</div><div class="cs">Permanent client and commercial record</div></div></div><div class="formgrid"><div><div class="kl">Client</div><b>${esc(r.client)}</b></div><div><div class="kl">Phone</div><b>${esc(r.phone)}</b></div><div><div class="kl">Customer type</div><b>${esc(r.type)}</b></div><div><div class="kl">Source / Lead</div><b>${esc(r.source)} ${r.lead?'· '+r.lead:''}</b></div><div><div class="kl">Budget</div><b>${money(r.budget)}</b></div><div><div class="kl">Estimate</div><b>${money(r.estimate)}</b></div><div class="full"><div class="kl">Scope / Request</div><div style="font-size:9.5px;line-height:1.5;margin-top:4px">${esc(r.details)}</div></div></div></div><div class="card"><div class="ch"><div><div class="ct">Activity & Communication Journal</div><div class="cs">Calls, WhatsApp, email, meetings, site visits and decisions</div></div><button class="btn primary" onclick="requestActivity('${id}')">Add Activity</button></div><div class="timeline">${r.activities.slice().reverse().map(a=>`<div class="tl"><b>${esc(a[1])}</b><p>${esc(a[3])}<br><strong>${esc(a[2])}</strong></p><time>${esc(a[0])}</time></div>`).join('')}</div></div></div><div><div class="card"><div class="ch"><div class="ct">Control Panel</div></div><div class="f"><label>Status</label><select id="rcStatus">${['New','Under Review','Awaiting Client','Site Assessment','Quoted','Converted','Rejected'].map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="f"><label>Owner</label><input id="rcOwner" value="${esc(r.owner)}"></div><div class="f"><label>Next action</label><input id="rcNext" value="${esc(r.next)}"></div><div class="f"><label>Due date</label><input id="rcDue" type="date" value="${r.due}"></div><button class="btn primary block" onclick="saveRequestControl('${id}')">Save Update</button></div><div class="card"><div class="ch"><div class="ct">Commercial Actions</div></div><button class="btn block" style="margin-bottom:6px" onclick="closeModal();openQuote('${id}')">Prepare Quotation</button><button class="btn block" style="margin-bottom:6px" onclick="scheduleAssessment('${id}')">Schedule Assessment</button><button class="btn block" onclick="convertRequest('${id}')">Convert to Service Order</button></div></div></div>`,`<button class="btn" onclick="closeModal()">Close</button>`,true)}

function saveRequest(edit=''){if(!nrClient.value||!nrPhone.value||!nrService.value){toastMsg('Client, phone and service are required','err');return}let s=data.services.find(x=>x.name===nrService.value),estimate=+(nrBudget.dataset.estimate||nrBudget.value||0);if(edit){let r=data.requests.find(x=>x.id===edit);Object.assign(r,{client:nrClient.value,type:nrType.value,phone:nrPhone.value,email:nrEmail.value,division:nrDivision.value,service:nrService.value,branch:nrBranch.value,source:nrSource.value,budget:+nrBudget.value,priority:nrPriority.value,details:nrDetails.value,due:nrDue.value,lead:nrLead.value,estimate});r.activities.push([new Date().toLocaleString('en-GB'),'Request edited',role,'Information updated.']);log('Request','Edited '+edit)}else{let id='REQ-'+new Date().toISOString().slice(2,10).replaceAll('-','')+'-'+String(data.requests.length+1).padStart(3,'0');data.requests.unshift({id,client:nrClient.value,phone:nrPhone.value,email:nrEmail.value,type:nrType.value,service:nrService.value,division:nrDivision.value,branch:nrBranch.value,source:nrSource.value,lead:nrLead.value,status:'New',priority:nrPriority.value,budget:+nrBudget.value,estimate,owner:'Unassigned',created:new Date().toISOString().slice(0,10),due:nrDue.value,details:nrDetails.value,next:'Review and assign request',activities:[[new Date().toLocaleString('en-GB'),'Request created',role,'Service request submitted and consent recorded.']]});log('Request','Created '+id)}save();closeModal();render();toastMsg('Service request saved','ok')}

class="f"><label>Status</label><select id="ocStatus">${['Pending Mobilisation','Active','Quality Review','Awaiting Client','Completed','On Hold','Cancelled'].map(x=>`<option ${x===o.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="f"><label>Progress (%)</label><input id="ocProgress" type="number" value="${o.progress}"></div><div class="f"><label>Current stage</label><input id="ocStage" value="${esc(o.stage)}"></div><div class="f"><label>Next action</label><input id="ocNext" value="${esc(o.next)}"></div><button class="btn primary block" onclick="saveOrder('${id}')">Save Update</button><button class="btn green block" style="margin-top:6px" onclick="advanceOrder('${id}')">Advance Stage</button></div><div class="card"><div class="ch"><div class="ct">Financial Summary</div></div><div class="metric"><label>Order value</label><strong>${money(o.value)}</strong></div><div class="metric"><label>Budget used</label><strong>${Math.round(o.progress*.82)}%</strong></div><div class="metric"><label>Projected margin</label><strong>27%</strong></div></div><div class="card"><div class="ch"><div class="ct">Quick Actions</div></div><button class="btn block" style="margin-bottom:6px" onclick="newDeliverable('${id}')">Add Deliverable</button><button class="btn block" style="margin-bottom:6px" onclick="clientApproval('${id}')">Request Client Approval</button><button class="btn block" onclick="newFeedback('${id}')">Record Feedback</button></div></div></div>`,`<button class="btn" onclick="closeModal()">Close</button>`,true)}
function saveOrder(id){let o=data.orders.find(x=>x.id===id);o.status=ocStatus.value;o.progress=Math.min(100,+ocProgress.value);o.stage=ocStage.value;o.next=ocNext.value;o.activities.push([new Date().toLocaleString('en-GB'),'Order control update',role,`${o.status}; ${o.progress}% complete; next: ${o.next}`]);save();log('Order','Updated '+id);closeModal();render();viewOrder(id);toastMsg('Order updated','ok')}
function advanceOrder(id){let o=data.orders.find(x=>x.id===id),i=o.milestones.findIndex(m=>m[1]==='Active');if(i>=0){o.milestones[i][1]='Done';if(o.milestones[i+1]){o.milestones[i+1][1]='Active';o.stage=o.milestones[i+1][0]}else{o.status='Completed';o.stage='Completed'}o.progress=Math.min(100,Math.round((i+1)/o.milestones.length*100));o.activities.push([new Date().toLocaleString('en-GB'),'Stage advanced',role,'Moved to '+o.stage]);save();log('Order','Advanced '+id);closeModal();render();viewOrder(id);toastMsg('Order advanced','ok')}}
function addMilestone(id){let v=prompt('Milestone name');if(v){data.orders.find(x=>x.id===id).milestones.push([v,'Pending']);save();closeModal();viewOrder(id)}}
function orderUpdate(id){let o=data.orders.find(x=>x.id===id);openModal('Add Order Progress Update',`<div class="formgrid"><div class="f"><label>Update type</label><select id="ouType"><option>Progress update</option><option>Site report</option><option>Client communication</option><option>Delay / blocker</option><option>Inspection</option><option>Material update</option><option>Decision</option></select></div><div class="f"><label>Visibility</label><select id="ouVis"><option>Internal and client</option><option>Internal only</option><option>Management only</option></select></div><div class="f full"><label>Detailed update</label><textarea id="ouNote"></textarea></div><div class="f"><label>Progress (%)</label><input id="ouProgress" type="number" value="${o.progress}"></div><div class="f"><label>Next action</label><input id="ouNext"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveOrderUpdate('${id}')">Save Update</button>`)}
function saveOrderUpdate(id){let o=data.orders.find(x=>x.id===id);o.progress=Math.min(100,+ouProgress.value);if(ouNext.value)o.next=ouNext.value;o.activities.push([new Date().toLocaleString('en-GB'),ouType.value,role,`${ouNote.value} (${ouVis.value})`]);save();closeModal();log('Order Activity','Updated '+id);render();toastMsg('Order update recorded','ok')}
function manualOrder(){openModal('Create Service Order',`<div class="formgrid"><div class="f"><label>Client</label><input id="moClient"></div><div class="f"><label>Service</label><select id="moService">${data.services.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="f"><label>Order value</label><input id="moValue" type="number"></div><div class="f"><label>Due date</label><input id="moDue" type="date" value="2026-07-30"></div><div class="f"><label>Owner</label><input id="moOwner" value="Service Manager"></div><div class="f"><label>Fulfillment mode</label><select id="moMode"><option>Quick service order</option><option>Managed service case</option><option>Project & worksite</option></select></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createManualOrder()">Create Order</button>`)}

function clientApproval(id){data.approvals.unshift({id:'APR-'+String(Date.now()).slice(-5),type:'Client Approval',ref:id,subject:'Milestone or deliverable approval',requester:role,approver:'Client',amount:0,status:'Pending',due:'2026-07-15'});save();closeModal();render();toastMsg('Client approval request sent','ok')}
function tasks(){let cols=['To Do','In Progress','Review','Done'];return `<div class="card"><div class="ch"><div><div class="ct">Execution Task Board</div><div class="cs">Tasks from workflows, inspections and handoffs</div></div><button class="btn primary" onclick="newTask()">New Task</button></div><div class="kanban">${cols.map(c=>`<div class="col"><div class="colh"><span>${c}</span><span>${data.tasks.filter(t=>t.status===c).length}</span></div>${data.tasks.filter(t=>t.status===c).map(t=>`<div class="task" onclick="advanceTask('${t.id}')"><b>${esc(t.title)}</b><small>${esc(t.order)} · ${esc(t.owner)}</small><div class="taskf">${badge(t.priority)}<span class="rsub">${t.due}</span></div></div>`).join('')||'<div class="empty" style="padding:14px 4px">No tasks</div>'}</div>`).join('')}</div></div>`}
function advanceTask(id){let t=data.tasks.find(x=>x.id===id),cols=['To Do','In Progress','Review','Done'],i=cols.indexOf(t.status);if(i<3)t.status=cols[i+1];save();log('Task',id+' → '+t.status);render();toastMsg('Task moved to '+t.status,'ok')}
function newTask(order=''){openModal('Create Execution Task',`<div class="formgrid"><div class="f"><label>Task title</label><input id="ntTitle"></div><div class="f"><label>Order / request</label><input id="ntOrder" value="${esc(order)}"></div><div class="f"><label>Owner</label><input id="ntOwner"></div><div class="f"><label>Due date</label><input id="ntDue" type="date" value="2026-07-16"></div><div class="f"><label>Priority</label><select id="ntPriority"><option>Normal</option><option>High</option><option>Critical</option></select></div><div class="f"><label>Evidence required</label><select><option>Yes</option><option>No</option></select></div><div class="f full"><label>Instructions / acceptance criteria</label><textarea id="ntNote"></textarea></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createTask()">Create Task</button>`)}
function createTask(){let id='TSK-'+String(Date.now()).slice(-5);data.tasks.unshift({id,title:ntTitle.value,order:ntOrder.value,status:'To Do',owner:ntOwner.value,due:ntDue.value,priority:ntPriority.value,note:ntNote.value});save();closeModal();log('Task','Created '+id);render();toastMsg('Task created','ok')}
function deliverables(){let rows=data.deliverables.map(d=>`<tr><td><b>${esc(d.title)}</b><div class="rsub">${d.id}</div></td><td>${d.order}</td><td>${esc(d.type)}</td><td>${esc(d.version)}</td><td>${esc(d.owner)}</td><td>${d.client?'Yes':'No'}</td><td>${d.date}</td><td>${badge(d.status)}</td><td><button class="btn small" onclick="viewDeliverable('${d.id}')">Open</button></td></tr>`).join('');return `<div class="card"><div class="ch"><div><div class="ct">Deliverables & Document Inbox</div><div class="cs">Reports, drawings, plans, certificates and client approvals</div></div><button class="btn primary" onclick="newDeliverable()">Add Deliverable</button></div><div class="tw"><table class="tbl"><thead><tr><th>Deliverable</th><th>Order</th><th>Type</th><th>Version</th><th>Owner</th><th>Client Visible</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
function newDeliverable(order=''){openModal('Add Deliverable / Document',`<div class="formgrid"><div class="f"><label>Order</label><input id="ndOrder" value="${esc(order)}"></div><div class="f"><label>Title</label><input id="ndTitle"></div><div class="f"><label>Type</label><select id="ndType"><option>Report</option><option>Drawing</option><option>Survey Plan</option><option>Certificate</option><option>Legal Document</option><option>Progress Evidence</option><option>Handover File</option></select></div><div class="f"><label>Version</label><input id="ndVersion" value="v1"></div><div class="f"><label>Client visibility</label><select id="ndClient"><option value="true">Visible to client</option><option value="false">Internal only</option></select></div><div class="f"><label>Approval</label><select id="ndApproval"><option>Supervisor approval</option><option>Client approval</option><option>No approval</option></select></div><div class="f full"><label>Upload file</label><input type="file"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createDeliverable()">Add Deliverable</button>`)}
function createDeliverable(){let id='DEL-'+String(Date.now()).slice(-5),st=ndApproval.value==='No approval'?'Approved':'Under Review';data.deliverables.unshift({id,order:ndOrder.value,title:ndTitle.value,type:ndType.value,version:ndVersion.value,owner:role,status:st,client:ndClient.value==='true',date:new Date().toISOString().slice(0,10)});if(st!=='Approved')data.approvals.unshift({id:'APR-'+String(Date.now()).slice(-5),type:'Deliverable',ref:id,subject:ndTitle.value,requester:role,approver:ndApproval.value==='Client approval'?'Client':'Supervisor',amount:0,status:'Pending',due:'2026-07-16'});save();closeModal();log('Deliverable','Added '+id);render();toastMsg('Deliverable added','ok')}
function viewDeliverable(id){let d=data.deliverables.find(x=>x.id===id);openModal(d.title,`<div class="g2"><div><div class="kl">Order</div><b>${d.order}</b><div class="kl" style="margin-top:11px">Type / Version</div><b>${esc(d.type)} · ${esc(d.version)}</b><div style="margin-top:11px">${badge(d.status)}</div></div><div class="notice blue"><b>Document Controls</b><br>Version history, reviewer comments, approval record, client visibility and download audit are retained.</div></div>`,`<button class="btn" onclick="closeModal()">Close</button>${d.status!=='Approved'?`<button class="btn green" onclick="approveDeliverable('${id}')">Approve</button>`:''}`)}

function estates(){let e=data.estates.find(x=>x.id===data.selectedEstate)||data.estates[0],sold=e.plots.filter(p=>p.status==='Sold').length,res=e.plots.filter(p=>p.status==='Reserved').length,av=e.plots.filter(p=>p.status==='Available').length;return `<div class="fg"><select onchange="data.selectedEstate=this.value;data.selectedPlot=null;save();render()">${data.estates.map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${esc(x.name)} — ${esc(x.location)}</option>`).join('')}</select><span class="grow"></span><button class="btn" onclick="newProperty()">Add Brokerage Property</button><button class="btn primary" onclick="newEstate()">Add Estate</button></div><div class="kgrid"><div class="kc"><div class="kl">Total plots</div><div class="kv">${e.plots.length}</div></div><div class="kc"><div class="kl">Sold plots</div><div class="kv" style="color:var(--r)">${sold}</div></div><div class="kc"><div class="kl">Reserved plots</div><div class="kv" style="color:#d49a00">${res}</div></div><div class="kc"><div class="kl">Available plots</div><div class="kv" style="color:var(--g)">${av}</div></div></div><div class="g21"><div class="card"><div class="ch"><div><div class="ct">Estate Layout & Inventory</div><div class="cs">Click a plot to reserve, sell, release or inspect it</div></div><div class="legend"><span><i style="background:#118849"></i>Available</span><span><i style="background:#dda600"></i>Reserved</span><span><i style="background:#d82125"></i>Sold</span><span><i style="background:#687386"></i>Hold</span></div></div><div class="plotgrid">${e.plots.map(p=>`<button class="plot ${p.status==='Available'?'av':p.status==='Reserved'?'rs':p.status==='Sold'?'sd':'hd'}" onclick="plotDetail('${e.id}','${p.no}')">${p.no}</button>`).join('')}</div></div><div><div class="card"><div class="ch"><div class="ct">Selected Plot</div></div><div id="selectedPlot">${data.selectedPlot?plotInfo(e.id,data.selectedPlot):'<div class="empty">Select a plot</div>'}</div></div><div class="card"> function plotInfo(eid,no){let e=data.estates.find(x=>x.id===eid),p=e.plots.find(x=>x.no===no);return `<div class="kc" style="background:#f7f9fc"><div class="kl">${esc(e.name)}</div><div class="kv">Plot ${p.no}</div><div class="ks">${p.size} sqm · ${money(p.price)}</div></div><div style="margin-top:9px">${badge(p.status)}</div><div class="f" style="margin-top:9px"><label>Status</label><select id="plotStatus">${['Available','Reserved','Sold','Hold'].map(x=>`<option ${x===p.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="f"><label>Client / reservation holder</label><input id="plotClient" value="${esc(p.client||'')}"></div><div class="f"><label>Agreed price</label><input id="plotPrice" type="number" value="${p.price}"></div><button class="btn primary block" onclick="savePlot('${eid}','${no}')">Save Plot Transaction</button>`}
function plotDetail(eid,no){data.selectedPlot=no;save();selectedPlot.innerHTML=plotInfo(eid,no)}
function savePlot(eid,no){let p=data.estates.find(x=>x.id===eid).plots.find(x=>x.no===no);p.status=plotStatus.value;p.client=plotClient.value;p.price=+plotPrice.value;save();log('Real Estate',`${eid} plot ${no} → ${p.status}`);render();toastMsg('Plot record updated','ok')}

function newProperty(){openModal('Add Brokerage Property',`<div class="formgrid"><div class="f"><label>Property title</label><input id="bpTitle"></div><div class="f"><label>Owner / mandate giver</label><input id="bpOwner"></div><div class="f"><label>Location</label><input id="bpLoc"></div><div class="f"><label>Asking price</label><input id="bpPrice" type="number"></div><div class="f"><label>Verification status</label><select id="bpStatus"><option>Pending Verification</option><option>Verified</option><option>Inspection Due</option></select></div><div class="f"><label>Commission rate (%)</label><input type="number" value="5"></div><div class="f full"><label>Title documents and images</label><input type="file" multiple></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createProperty()">Add Listing</button>`)}

class="btn primary" onclick="openRequest('${cfg[3]}')">New Request</button></div>${life(cfg[2],3)}</div><div class="card"><div class="ch"><div class="ct">Live Orders</div></div><div class="tw"><table class="tbl"><thead><tr><th>Order</th><th>Client</th><th>Service</th><th>Stage</th><th>Progress</th><th>Owner</th><th></th></tr></thead><tbody>${os.map(o=>`<tr><td><b>${o.id}</b></td><td>${esc(o.client)}</td><td>${esc(o.service)}</td><td>${esc(o.stage)}</td><td><div class="progress" style="width:90px"><i style="width:${o.progress}%"></i></div></td><td>${esc(o.owner)}</td><td><button class="btn small" onclick="viewOrder('${o.id}')">Open</button></td></tr>`).join('')||'<tr><td colspan="7">No active orders.</td></tr>'}</tbody></table></div></div>`}
function clientPortal(){return `<div class="card" style="background:linear-gradient(135deg,#173779,#3158b0);color:#fff;border:0"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><div style="font-size:8px;opacity:.7">CLIENT PORTAL</div><div style="font-size:19px;font-weight:800;margin-top:5px">Welcome, Chief Okafor Sunday Silas</div><div style="font-size:9px;opacity:.72;margin-top:5px">Track requests, payments, work, approvals and documents.</div></div><button class="btn" onclick="openRequest()">Request a Service</button></div></div><div class="kgrid"><div class="kc"><div class="kl">Open requests</div><div class="kv">2</div></div><div class="kc"><div class="kl">Active orders</div><div class="kv">1</div></div><div class="kc"><div class="kl">Outstanding balance</div><div class="kv">₦8.4M</div></div><div class="kc"><div class="kl">Documents awaiting approval</div><div class="kv">3</div></div></div><div class="g21"><div class="card"><div class="ch"><div><div class="ct">My Active Service</div><div class="cs">Six-bedroom duplex construction — carcass stage</div></div><span class="pill pb">54% complete</span></div><div class="progress"><i style="width:54%"></i></div><div style="margin-top:12px">${life(['Request','Contract','Mobilisation','Execution','Inspection','Handover'],3)}</div></div><div class="card"><div class="ch"><div class="ct">Actions Required</div></div>${[['Approve revised work programme','Due tomorrow','ti ti-file-check'],['Milestone payment','₦8,400,000 due','ti ti-cash'],['Site progress report available','Uploaded today','ti ti-message-circle']].map(x=>`<div class="row"><div class="ico" style="background:#dbeafe;color:#1e40af"><i class="${x[2]}"></i></div><div class="rm"><div class="rn">${x[0]}</div><div class="rsub">${x[1]}</div></div><button class="btn small">Review</button></div>`).join('')}</div></div>`}
function feedback(){let rows=data.feedback.map(f=>`<tr><td><b>${f.id}</b><div class="rsub">${f.date}</div></td><td>${esc(f.client)}</td><td>${esc(f.service)}</td><td>${f.order}</td><td>${'★'.repeat(f.rating)}${'☆'.repeat(5-f.rating)}</td><td>${esc(f.type)}</td><td>${esc(f.comment)}</td><td>${badge(f.status)}</td></tr>`).join('');return `<div class="kgrid"><div class="kc"><div class="kl">Average rating</div><div class="kv">4.6/5</div></div><div class="kc"><div class="kl">Client satisfaction</div><div class="kv">92%</div></div><div class="kc"><div class="kl">Rework rate</div><div class="kv">4.3%</div></div><div class="kc"><div class="kl">Repeat clients</div><div class="kv">31%</div></div></div><div class="card"><div class="ch"><div><div class="ct">Service Feedback Register</div><div class="cs">Completion feedback, defects, complaints and testimonials</div></div><button class="btn primary" onclick="newFeedback()">Record Feedback</button></div><div class="tw"><table class="tbl"><thead><tr><th>Feedback</th><th>Client</th><th>Service</th><th>Order</th><th>Rating</th><th>Type</th><th>Comment</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
function newFeedback(order=''){let o=order?data.orders.find(x=>x.id===order):data.orders[0];openModal('Record Client Feedback',`<div class="formgrid"><div class="f"><label>Order</label><select id="fbOrder">${data.orders.map(x=>`<option value="${x.id}" ${x.id===o?.id?'selected':''}>${x.id} — ${esc(x.client)}</option>`).join('')}</select></div><div class="f"><label>Type</label><select id="fbType"><option>Completion</option><option>Milestone</option><option>Complaint</option><option>Defect / Rework</option><option>Testimonial</option><option>Referral</option></select></div><div class="f"><label>Rating</label><select id="fbRating"><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Satisfactory</option><option value="2">2 — Poor</option><option value="1">1 — Very poor</option></select></div><div class="f"><label>Status</label><select id="fbStatus"><option>Closed</option><option>Open</option><option>Action Required</option></select></div><div class="f full"><label>Client comment</label><textarea id="fbComment"></textarea></div><div class="f full"><label>Corrective action / internal note</label><textarea></textarea></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createFeedback()">Save Feedback</button>`)}
function createFeedback(){let o=data.orders.find(x=>x.id===fbOrder.value),id='FDB-'+String(Date.now()).slice(-5);data.feedback.unshift({id,order:o.id,client:o.client,service:o.service,rating:+fbRating.value,type:fbType.value,comment:fbComment.value,status:fbStatus.value,date:new Date().toISOString().slice(0,10)});save();closeModal();log('Feedback','Recorded '+id);render();toastMsg('Feedback recorded','ok')}
function reports(){return `<div class="kgrid"><div class="kc"><div class="kl">Quote-to-order conversion</div><div class="kv">61%</div></div><div class="kc"><div class="kl">Average response time</div><div class="kv">38m</div></div><div class="kc"><div class="kl">Gross service margin</div><div class="kv">29%</div></div><div class="kc"><div class="kl">On-time delivery</div><div class="kv">87%</div></div></div><div class="g2"><div class="card"><div class="ch"><div class="ct">Service Performance</div><button class="btn small" onclick="exportCSV('services')">Export CSV</button></div>${[['Estate Plot Sales',68,4500000],['Building Construction',54,245000000],['Cadastral Land Survey',78,3200000],['Software Development',24,12000000],['Structural Inspection',0,591250]].map(x=>`<div class="metric"><label><b>${x[0]}</b><div class="rsub">${x[1]}% average completion</div></label><div class="progress" style="width:130px"><i style="width:${x[1]}%"></i></div><strong>${money(x[2])}</strong></div>`).join('')}</div><div class="card"><div class="ch"><div class="ct">Branch Performance</div></div><div class="tw"><table class="tbl"><thead><tr><th>Branch</th><th>Requests</th><th>Active Orders</th><th>Revenue</th><th>SLA</th><th>CSAT</th></tr></thead><tbody>${branches.map((b,i)=>`<tr><td><b>${b}</b></td><td>${[42,21,31,18][i]}</td><td>${[15,7,11,6][i]}</td><td>${money([184000000,62000000,138000000,74000000][i])}</td><td>${[93,86,89,91][i]}%</td><td>${[94,88,91,93][i]}%</td></tr>`).join('')}</tbody></table></div></div></div>`}
function audit(){return `<div class="card"><div class="ch"><div><div class="ct">Audit & Activity Log</div><div class="cs">Permanent accountability record</div></div><button class="btn" onclick="exportCSV('audit')">Export</button></div><div class="tw"><table class="tbl"><thead><tr><th>Date & Time</th><th>User / Role</th><th>Area</th><th>Action</th></tr></thead><tbody>${data.audit.map(a=>`<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td><td>${esc(a[2])}</td><td>${esc(a[3])}</td></tr>`).join('')}</tbody></table></div></div>`}
function exportCSV(type){let rows=type==='audit'?[['Date','User','Area','Action'],...data.audit]:[['Service','Division','Status','SLA','Owner'],...data.services.map(s=>[s.name,s.division,s.status,s.sla,s.owner])],csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='bomach_'+type+'.csv';a.click();URL.revokeObjectURL(a.href);toastMsg('CSV exported','ok')}
function globalFind(q){q=q.toLowerCase().trim();if(q.length<2)return;let r=data.requests.find(x=>(x.id+x.client+x.service).toLowerCase().includes(q));if(r){showRequest(r.id);return}let o=data.orders.find(x=>(x.id+x.client+x.service).toLowerCase().includes(q));if(o){viewOrder(o.id);return}toastMsg('No matching request or order','err')}

function openServiceWizard(){wizard=0;openModal('Create & Activate Service',`<div class="wsteps">${['Basic','Sub-services','Pricing','Request Form','Workflow','Publish'].map((x,i)=>`<div class="ws ${i===0?'on':''}">${i+1}. ${x}</div>`).join('')}</div>
<div class="wp on" id="wp0"><div class="formgrid"><div class="f"><label>Service name</label><input id="swName"></div><div class="f"><label>Service code</label><input id="swCode" placeholder="ENG-REN"></div><div class="f"><label>Division</label><select id="swDivision">${divisions.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="f"><label>Owner role</label><input id="swOwner" value="Service Manager"></div><div class="f full"><label>Description</label><textarea id="swDesc"></textarea></div><div class="f"><label>SLA (days)</label><input id="swSla" type="number" value="5"></div><div class="f"><label>Fulfillment mode</label><select id="swMode"><option>Quick service order</option><option>Managed service case</option><option>Project & worksite</option><option>Transaction & allocation</option><option>Supply order</option></select></div></div></div>
<div class="wp" id="wp1"><div class="f"><label>Sub-services — one per line</label><textarea id="swSubs" style="min-height:190px">Standard Package
Premium Package</textarea></div></div>
<div class="wp" id="wp2"><div class="formgrid"><div class="f"><label>Pricing method</label><select id="swPrice"><option>Fixed</option><option>Unit rate</option><option>Area rate</option><option>Percentage</option></select></div><div class="f"><label>Base / unit price</label><input id="swRate" type="number" value="100000"></div><div class="f"><label>Deposit (%)</label><input id="swDeposit" type="number" value="70"></div><div class="f"><label>Tax (%)</label><input id="swTax" type="number" value="0"></div><div class="f"><label>Discount approval above (%)</label><input id="swApproval" type="number" value="5"></div></div></div>
<div class="wp" id="wp3"><div class="notice blue">Select information required before submission.</div><div class="checks">${['Client identity','Phone & email','Customer type','Location / site','Budget','Preferred date','Scope / message','Document uploads','Images / videos','Title documents','Consent','Lead / campaign source'].map((x,i)=>`<label class="check"><input class="swForm" type="checkbox" value="${x}" ${i<8?'checked':''}>${x}</label>`).join('')}</div></div>
<div class="wp" id="wp4"><div class="f"><label>Workflow stages — one per line</label><textarea id="swWorkflow" style="min-height:190px">Request Review
Technical Assessment
Quotation
Approval
Invoice & Payment
Service Order
Execution
Quality Review
Client Acceptance
Completion & Feedback</textarea></div></div>
<div class="wp" id="wp5"><div class="formgrid"><div class="f full"><label>Active branches</label><div class="checks">${branches.map(x=>`<label class="check"><input class="swBranch" type="checkbox" value="${x}" checked>${x}</label>`).join('')}</div></div><div class="f"><label>Status</label><select id="swStatus"><option>Draft</option><option>Active</option><option>Paused</option></select></div><div class="f"><label>Client visibility</label><select><option>Visible in catalogue</option><option>Internal only</option></select></div></div><div class="notice greenbox"><b>Ready to create.</b><br>The service, calculator, request form, workflow and branch activation will be created together.</div></div>`,`<button class="btn" id="wizPrev" onclick="moveWizard(-1)" disabled>Previous</button><button class="btn primary" id="wizNext" onclick="moveWizard(1)">Next</button>`,true)}
function moveWizard(d){if(d===1&&wizard===5){createService();return}wizard=Math.max(0,Math.min(5,wizard+d));document.querySelectorAll('.wp').forEach((x,i)=>x.classList.toggle('on',i===wizard));document.querySelectorAll('.ws').forEach((x,i)=>x.classList.toggle('on',i===wizard));wizPrev.disabled=wizard===0;wizNext.textContent=wizard===5?'Create Service':'Next'}
function createService(){if(!swName.value||!swCode.value){toastMsg('Service name and code are required','err');return}let sid='SVC-'+String(Date.now()).slice(-5),cid='CALC-'+String(Date.now()).slice(-5),subs=swSubs.value.split('\n').map(x=>x.trim()).filter(Boolean),wf=swWorkflow.value.split('\n').map(x=>x.trim()).filter(Boolean),form=[...document.querySelectorAll('.swForm:checked')].map(x=>x.value),br=[...document.querySelectorAll('.swBranch:checked')].map(x=>x.value),formula=swPrice.value==='Percentage'?'base_amount * rate / 100':swPrice.value==='Fixed'?'rate':'quantity * rate',fields=swPrice.value==='Percentage'?[['base_amount','Base amount',10000000],['rate','Rate (%)',+swRate.value]]:swPrice.value==='Fixed'?[['rate','Fixed price',+swRate.value]]:[['quantity','Quantity / area',1],['rate','Unit rate',+swRate.value]];data.calculators.push({id:cid,name:swName.value+' Calculator',service:swName.value,template:swPrice.value,formula,fields,tax:+swTax.value,deposit:+swDeposit.value,approval:+swApproval.value});data.services.push({id:sid,name:swName.value,division:swDivision.value,code:swCode.value,description:swDesc.value,owner:swOwner.value,status:swStatus.value,sla:+swSla.value,mode:swMode.value,branches:br,subs,calculator:cid,form,workflow:wf});data.selectedService=sid;save();closeModal();log('Service','Created '+sid+' with calculator, form and workflow');screen='catalog';render();toastMsg('Service created successfully','ok')}
window.addEventListener('click',e=>{if(e.target===modalBack)closeModal();if(!e.target.closest('.notif')&&!e.target.closest('.bell'))notif.classList.remove('show')});
