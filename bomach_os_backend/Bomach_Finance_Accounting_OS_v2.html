function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{return JSON.parse(localStorage.getItem('bomachFinanceOS'))||clone(seed)}catch(e){return clone(seed)}}
function save(){localStorage.setItem('bomachFinanceOS',JSON.stringify(data))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(n){n=Number(n||0);return n>=1e9?'₦'+(n/1e9).toFixed(1)+'B':n>=1e6?'₦'+(n/1e6).toFixed(n%1e6?1:0)+'M':'₦'+n.toLocaleString('en-NG')}
function badge(s){let c=/Paid|Approved|Verified|Active|Posted|Reconciled|Payable/.test(s)?'pg':/Overdue|Rejected|Blocked/.test(s)?'pr':/Pending|Awaiting|Part Paid|Sent|Scheduled|Unmatched|Difference|Watch|Restricted/.test(s)?'py':/Draft/.test(s)?'px':'pb';return `<span class="pill ${c}">${esc(s)}</span>`}
function toastMsg(m,t=''){let e=document.createElement('div');e.className='toast '+t;e.textContent=m;toast.appendChild(e);setTimeout(()=>e.remove(),2600)}
function log(area,action){data.audit.unshift([new Date().toLocaleString('en-GB'),role,area,action]);save()}
function openModal(title,body,foot='',xl=false){modalTitle.textContent=title;modalBody.innerHTML=body;modalFoot.innerHTML=foot;modal.className='modal'+(xl?' xl':'');modalBack.classList.add('show')}
function closeModal(){modalBack.classList.remove('show')}
function loginApp(){role=loginRole.value;roleSwitch.value=role;rolePill.textContent=role;login.style.display='none';shell.style.display='block';render()}

function toggleNotif(){notif.classList.toggle('show')}

function life(arr,active=2){return `<div class="life">${arr.map((x,i)=>`<div class="step ${i<active?'done':i===active?'active':''}"><small>${String(i+1).padStart(2,'0')}</small><b>${esc(x)}</b><span>${i<active?'Completed':i===active?'In progress':'Pending'}</span></div>`).join('')}</div>`}
function table(head,rows){return `<div class="tw"><table class="tbl"><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`}
function inPeriod(date,mode=periodMode){let d=new Date(date+'T00:00:00'),a=new Date(asOf+'T00:00:00');if(mode==='day')return date===asOf;if(mode==='week')return (a-d)/86400000>=0&&(a-d)/86400000<7;if(mode==='month')return date.slice(0,7)===asOf.slice(0,7);return date.slice(0,4)===asOf.slice(0,4)}
function setPeriod(m){periodMode=m;render()}
function periodButtons(){return `<div class="tabs" style="max-width:390px;margin:0"><div class="tab ${periodMode==='day'?'on':''}" onclick="setPeriod('day')">Today</div><div class="tab ${periodMode==='week'?'on':''}" onclick="setPeriod('week')">Last 7 days</div><div class="tab ${periodMode==='month'?'on':''}" onclick="setPeriod('month')">This month</div><div class="tab ${periodMode==='year'?'on':''}" onclick="setPeriod('year')">This year</div></div>`}
function orderPaid(id){return data.orderCosts.filter(x=>x.order===id&&x.status==='Paid').reduce((a,b)=>a+b.amount,0)}
function orderCommitted(id){return data.orderCosts.filter(x=>x.order===id&&x.status==='Committed').reduce((a,b)=>a+b.amount,0)}
function orderCollected(id){return data.payments.filter(x=>x.order===id&&x.status==='Verified').reduce((a,b)=>a+b.amount,0)}
function orderInvoiced(id){return data.invoices.filter(x=>x.order===id).reduce((a,b)=>a+b.total,0)}
function estateCost(x){return x.acquisition+x.acquisition*x.agencyRate/100+x.legal+x.clearing+x.fencing+x.gatehouse+x.roads+x.survey+x.marketing+x.contingency}
function dash(){

function openInvoice(){openModal('Create Customer Invoice',`<div class="formgrid"><div class="f"><label>Client</label><input id="ivClient" placeholder="Client name"></div><div class="f"><label>Service</label><input id="ivService" placeholder="Service or revenue source"></div><div class="f"><label>Branch</label><select id="ivBranch"><option>Enugu</option><option>Lagos</option><option>Abuja</option><option>Port Harcourt</option></select></div><div class="f"><label>Project / Reference</label><input id="ivProject"></div><div class="f"><label>Service Order</label><select id="ivOrder"><option value="">Unlinked</option>${data.serviceOrders.map(x=>`<option value="${x.id}">${x.id} — ${esc(x.project)}</option>`).join('')}</select></div><div class="f"><label>Amount</label><input id="ivAmount" type="number"></div><div class="f"><label>Due date</label><input id="ivDue" type="date" value="2026-07-31"></div><div class="f full"><label>Description</label><textarea id="ivDesc"></textarea></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createInvoice()">Create Invoice</button>`)}

function createPayment(){let ref=payRef.value.trim();if(data.payments.some(x=>x.reference===ref)){toastMsg('Duplicate payment reference blocked','err');return}let id='PAY-'+String(Date.now()).slice(-8),inv=payInvoice.value,amount=+payAmount.value||0,x=data.invoices.find(z=>z.id===inv),order=x?.order||'',status=inv==='Unmatched'?'Unmatched':'Verified',date=new Date().toISOString().slice(0,10);data.payments.unshift({id,date,client:payClient.value||x?.client||'Depositor',invoice:inv,order,amount,method:payMethod.value,account:payAccount.value,reference:ref||id,status});if(x){x.paid+=amount;x.status=x.paid>=x.total?'Paid':'Part Paid'}data.cashbook.push({id:'CB-'+String(Date.now()).slice(-7),date,type:'Inflow',source:status==='Unmatched'?'Unmatched Deposit':'Client Payment',reference:id,description:(x?.client||payClient.value||'Depositor')+' payment',account:payAccount.value,order,service:x?.service||'Unallocated',project:x?.project||'Unallocated',amount,status:status==='Verified'?'Posted':'Pending Match'});save();log('Payment','Recorded '+id+' for '+money(amount));closeModal();render();toastMsg('Payment recorded, receipted and posted to cashbook','ok')}

function createExpense(){let id='EXP-'+String(Date.now()).slice(-8),amount=+exAmount.value||0,order=exOrder.value,o=data.serviceOrders.find(x=>x.id===order),project=exProject.value||o?.project||'General';data.expenses.unshift({id,date:new Date().toISOString().slice(0,10),requester:exRequester.value,category:exCategory.value,costType:exCostType.value,stage:exStage.value||'General',billable:exBillable.value,branch:exBranch.value,project,order,amount,status:'Pending Finance',beneficiary:exBeneficiary.value,purpose:exPurpose.value});data.approvals.unshift({id:'APR-'+String(Date.now()).slice(-7),type:'Expense',ref:id,subject:exPurpose.value||'Expense request',requester:exRequester.value,approver:'Finance Manager',amount,status:'Pending'});save();log('Expense','Submitted '+id+(order?' against '+order:''));closeModal();render();toastMsg('Expense submitted and linked to cost control','ok')}
function approveExpense(id){let x=data.expenses.find(z=>z.id===id);x.status='Approved';if(x.order&&!data.orderCosts.some(c=>c.id==='OC-'+id)){data.orderCosts.push({id:'OC-'+id,order:x.order,date:x.date,category:x.category,stage:x.stage,description:x.purpose,beneficiary:x.beneficiary,amount:x.amount,status:'Committed',billable:x.billable||'No',clientVisible:x.billable==='Yes'})}save();log('Expense','Approved '+id);render();toastMsg('Expense approved and committed to order budget','ok')}
function payExpense(id){let x=data.expenses.find(z=>z.id===id);x.status='Paid';let c=data.orderCosts.find(z=>z.id==='OC-'+id);if(c)c.status='Paid';else if(x.order)data.orderCosts.push({id:'OC-'+id,order:x.order,date:new Date().toISOString().slice(0,10),category:x.category,stage:x.stage,description:x.purpose,beneficiary:x.beneficiary,amount:x.amount,status:'Paid',billable:x.billable||'No',clientVisible:x.billable==='Yes'});let o=data.serviceOrders.find(z=>z.id===x.order);data.cashbook.push({id:'CB-'+String(Date.now()).slice(-7),date:new Date().toISOString().slice(0,10),type:'Outflow',source:x.order?'Service Cost':'Expense',reference:id,description:x.purpose,account:'GTBank Operating',order:x.order||'',service:o?.service||x.category,project:x.project,amount:x.amount,status:'Posted'});save();log('Expense','Paid '+id+' and posted to cashbook');render();toastMsg('Expense paid and posted to order ledger','ok')}
function openVendorBill(){openModal('Create Vendor Bill',`<div class="formgrid"><div class="f"><label>Vendor</label><input id="vbVendor"></div><div class="f"><label>Category</label><input id="vbCategory"></div><div class="f"><label>Project / Cost Centre</label><input id="vbProject"></div><div class="f"><label>Gross amount</label><input id="vbAmount" type="number"></div><div class="f"><label>Withholding tax</label><input id="vbWht" type="number" value="0"></div><div class="f"><label>Due date</label><input id="vbDue" type="date" value="2026-07-31"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createVendorBill()">Create Bill</button>`)}
function createVendorBill(){let id='BILL-'+String(Date.now()).slice(-8);data.vendors.unshift({id,vendor:vbVendor.value,category:vbCategory.value,project:vbProject.value,amount:+vbAmount.value||0,due:vbDue.value,status:'Awaiting Approval',withholding:+vbWht.value||0});save();log('Vendor Bill','Created '+id);closeModal();render();toastMsg('Vendor bill created','ok')}
function openWallet(){openModal('Create Client or Project Wallet',`<div class="formgrid"><div class="f"><label>Owner</label><input id="waName"></div><div class="f"><label>Wallet type</label><select id="waType"><option>General Client Wallet</option><option>Project Wallet</option><option>Property Wallet</option><option>Restricted Project Wallet</option></select></div><div class="f full"><label>Project / Purpose</label><input id="waProject"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createWallet()">Create Wallet</button>`)}
function createWallet(){let id='WAL-'+String(Date.now()).slice(-7);data.wallets.unshift({id,name:waName.value,type:waType.value,project:waProject.value,funded:0,spent:0,committed:0,status:waType.value.includes('Restricted')?'Restricted':'Active'});save();log('Wallet','Created '+id);closeModal();render();toastMsg('Wallet created','ok')}
function openBudget(){openModal('Create Budget',`<div class="formgrid"><div class="f"><label>Budget name</label><input id="buName"></div><div class="f"><label>Owner</label><input id="buOwner"></div><div class="f"><label>Period</label><input id="buPeriod" value="FY 2026"></div><div class="f"><label>Approved amount</label><input id="buAmount" type="number"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createBudget()">Create Budget</button>`)}
function createBudget(){let id='BUD-'+String(Date.now()).slice(-6);data.budgets.unshift({id,name:buName.value,owner:buOwner.value,period:buPeriod.value,approved:+buAmount.value||0,spent:0,committed:0,status:'Active'});save();log('Budget','Created '+id);closeModal();render();toastMsg('Budget created','ok')}
function decideApproval(id,status){let x=data.approvals.find(z=>z.id===id);x.status=status;if(x.type==='Expense'){let e=data.expenses.find(z=>z.id===x.ref);if(e)e.status=status}save();log('Approval',status+' '+id);render();toastMsg('Approval '+status.toLowerCase(),status==='Approved'?'ok':'err')}
function runPayroll(id){let x=data.payroll.find(z=>z.id===id);x.status='Awaiting Approval';save();log('Payroll','Calculated '+id);render();toastMsg('Payroll calculated and routed for approval','ok')}
function approveCommission(id){let x=data.commissions.find(z=>z.id===id);x.status='Approved';save();log('Commission','Approved '+id);render();toastMsg('Commission approved','ok')}
function matchPayment(id){let x=data.payments.find(z=>z.id===id);let inv=data.invoices.find(z=>z.status!=='Paid');if(inv){x.invoice=inv.id;x.client=inv.client;x.order=inv.order||'';x.status='Verified';inv.paid+=x.amount;inv.status=inv.paid>=inv.total?'Paid':'Part Paid';let cb=data.cashbook.find(c=>c.reference===id);if(cb){cb.order=inv.order||'';cb.service=inv.service;cb.project=inv.project;cb.description=inv.client+' payment';cb.status='Posted'}}save();log('Reconciliation','Matched '+id);render();toastMsg('Payment matched and posted','ok')}
function openServiceOrder(){openModal('Register or Sync Service Order',`<div class="formgrid"><div class="f"><label>Client</label><input id="soClient"></div><div class="f"><label>Service</label><select id="soService"><option>Building Construction</option><option>Land Surveying</option><option>Structural Inspection</option><option>Software Development</option><option>Property Transaction</option><option>Consultancy</option><option>Other Service</option></select></div><div class="f"><label>Project / Order name</label><input id="soProject"></div><div class="f"><label>Source Service Order ID</label><input id="soSource"></div><div class="f"><label>Contract type</label><select id="soType"><option>Turnkey Construction</option><option>Labour + Professional Fee</option><option>Labour Only</option><option>Project Management Fee</option><option>Fixed Professional Fee</option><option>Milestone Fixed Price</option><option>Retainer</option></select></div><div class="f"><label>Branch</label><select id="soBranch"><option>Enugu</option><option>Lagos</option><option>Abuja</option><option>Port Harcourt</option></select></div><div class="f"><label>Contract value</label><input id="soValue" type="number"></div><div class="f"><label>Cost budget</label><input id="soBudget" type="number"></div><div class="f"><label>Start date</label><input id="soStart" type="date" value="2026-07-15"></div><div class="f"><label>Due date</label><input id="soDue" type="date"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createServiceOrder()">Create Cost Centre</button>`)}
function createServiceOrder(){let id='SORD-'+String(Date.now()).slice(-7);data.serviceOrders.unshift({id,source:soSource.value||id,client:soClient.value,service:soService.value,project:soProject.value,branch:soBranch.value,contractType:soType.value,contractValue:+soValue.value||0,budget:+soBudget.value||0,overhead:0,status:'Active',owner:role,start:soStart.value,due:soDue.value});save();log('Service Order','Registered '+id);closeModal();render();toastMsg('Service order profitability centre created','ok')}
function openOrderCost(order){openExpense(order)}
function openEstate(){openModal('New Estate Feasibility',`<div class="formgrid"><div class="f"><label>Estate name</label><input id="esName"></div><div class="f"><label>Location</label><input id="esLocation"></div><div class="f"><label>Land acquisition cost</label><input id="esAcq" type="number"></div><div class="f"><label>Agency rate (%)</label><input id="esAgency" type="number" value="3"></div><div class="f"><label>Total plots</label><input id="esTotal" type="number"></div><div class="f"><label>Sellable plots</label><input id="esSell" type="number"></div><div class="f"><label>Average unit price</label><input id="esPrice" type="number"></div><div class="f"><label>Development allowance</label><input id="esDev" type="number" placeholder="Total fencing, clearing, road etc."></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createEstate()">Create Feasibility</button>`)}
function createEstate(){let id='EST-'+String(Date.now()).slice(-7),dev=+esDev.value||0;data.estateProjects.unshift({id,name:esName.value,location:esLocation.value,acquisition:+esAcq.value||0,agencyRate:+esAgency.value||0,legal:dev*.08,clearing:dev*.12,fencing:dev*.22,gatehouse:dev*.1,roads:dev*.25,survey:dev*.08,marketing:dev*.1,contingency:dev*.05,totalPlots:+esTotal.value||0,sellablePlots:+esSell.value||0,unitPrice:+esPrice.value||0,soldPlots:0,collected:0,status:'Feasibility'});save();log('Estate Finance','Created feasibility '+id);closeModal();render();toastMsg('Estate feasibility created','ok')}
function openJournal(){openModal('Create Manual Journal',`<div class="formgrid"><div class="f full"><label>Memo</label><input id="jrMemo"></div><div class="f"><label>Debit account</label><select id="jrDebit">${data.coa.filter(x=>x[2]!=='Parent').map(x=>`<option>${x[1]}</option>`).join('')}</select></div><div class="f"><label>Credit account</label><select id="jrCredit">${data.coa.filter(x=>x[2]!=='Parent').map(x=>`<option>${x[1]}</option>`).join('')}</select></div><div class="f"><label>Amount</label><input id="jrAmount" type="number"></div><div class="f"><label>Date</label><input id="jrDate" type="date" value="2026-07-15"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createJournal()">Save Draft</button>`)}
function createJournal(){if(jrDebit.value===jrCredit.value){toastMsg('Debit and credit accounts must differ','err');return}let id='JRN-'+String(Date.now()).slice(-8);data.journals.unshift({id,date:jrDate.value,memo:jrMemo.value,debit:jrDebit.value,credit:jrCredit.value,amount:+jrAmount.value||0,status:'Draft'});save();log('Journal','Created '+id);closeModal();render();toastMsg('Balanced journal draft created','ok')}
function postJournal(id){let x=data.journals.find(z=>z.id===id);x.status='Posted';save();log('Journal','Posted '+id);render();toastMsg('Journal posted and locked','ok')}
function globalFind(q){q=q.toLowerCase().trim();if(!q)return;let found=data.invoices.find(x=>JSON.stringify(x).toLowerCase().includes(q))||data.payments.find(x=>JSON.stringify(x).toLowerCase().includes(q))||data.expenses.find(x=>JSON.stringify(x).toLowerCase().includes(q))||data.serviceOrders.find(x=>JSON.stringify(x).toLowerCase().includes(q))||data.estateProjects.find(x=>JSON.stringify(x).toLowerCase().includes(q));if(found){toastMsg('Found '+(found.id||found.name),'ok')}else toastMsg('No finance record found','err')}
function exportCSV(type){let rows,headers;if(type==='payments'){rows=data.payments;headers=Object.keys(rows[0]||{})}else if(type==='cashbook'){rows=data.cashbook;headers=Object.keys(rows[0]||{})}else{rows=data.audit.map(x=>({timestamp:x[0],user:x[1],area:x[2],action:x[3]}));headers=Object.keys(rows[0]||{})}let csv=headers.join(',')+'\n'+rows.map(x=>headers.map(h=>`"${String(x[h]??'').replaceAll('"','""')}"`).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=type+'.csv';a.click();URL.revokeObjectURL(a.href)}
init();
</script>
</body>
